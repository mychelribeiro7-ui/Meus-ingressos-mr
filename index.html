<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Ingressos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f1115;
            color: #ffffff;
            padding: 16px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-top: 8px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
        }
        .header-icons {
            display: flex;
            gap: 12px;
        }
        .icon-btn {
            background: #1e222b;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            cursor: pointer;
        }
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
        .tab.active {
            background-color: #ffffff;
            color: #000000;
        }
        .tab.inactive {
            background-color: #1e222b;
            color: #8b949e;
        }
        .section-title {
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .ticket-card {
            background-color: #161b22;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            gap: 16px;
            cursor: pointer;
            border: 1px solid #30363d;
            align-items: center;
            margin-bottom: 12px;
        }
        .ticket-thumb-container {
            width: 85px;
            height: 85px;
            border-radius: 10px;
            overflow: hidden;
            background: #ffffff;
            flex-shrink: 0;
            border: 1px solid #30363d;
        }
        .ticket-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .ticket-info h3 {
            font-size: 12px;
            color: #3fb950;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .ticket-info h2 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ffffff;
        }
        .ticket-info p {
            font-size: 14px;
            color: #8b949e;
        }

        /* Vista de Detalhe com Carrossel Horizontal em Tela Cheia */
        #detail-view {
            display: none;
            background-color: #000000;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            z-index: 100;
        }
        .detail-header {
            background-color: #0f1115;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid #30363d;
        }
        .back-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
        }
        .detail-header-info h2 {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
        }
        .detail-header-info p {
            font-size: 12px;
            color: #8b949e;
        }

        /* Contentor do Carrossel Exibindo os Prints Inteiros */
        .ticket-carousel {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            height: calc(100vh - 70px);
        }
        .ticket-carousel::-webkit-scrollbar {
            display: none;
        }

        .ticket-slide {
            min-width: 100%;
            height: 100%;
            scroll-snap-align: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            background: #000;
            overflow-y: auto;
            padding-bottom: 30px;
        }
        
        .full-ticket-img {
            width: 100%;
            max-width: 500px;
            height: auto;
            display: block;
        }

        .ticket-counter {
            text-align: center;
            color: #8b949e;
            font-size: 13px;
            padding: 12px;
            background: #0f1115;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Ecrã Principal (Lista) -->
    <div id="list-view">
        <div class="header">
            <h1>Meus ingressos</h1>
            <div class="header-icons">
                <button class="icon-btn">🔔</button>
                <button class="icon-btn">👤</button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active">Próximos</button>
            <button class="tab inactive">Anterior</button>
        </div>

        <div class="section-title">Outubro 2026</div>

        <div class="ticket-card" onclick="openTicket()">
            <div class="ticket-thumb-container">
                <img src="img1.jpg" alt="BTS" class="ticket-thumb">
            </div>
            <div class="ticket-info">
                <h3>3 ingressos Sexta-Feira 30 20:00hs</h3>
                <h2>BTS WORLD TOUR ARIRANG</h2>
                <p>MorumBis</p>
            </div>
        </div>
    </div>

    <!-- Ecrã de Detalhe com o Carrossel dos Prints Reais -->
    <div id="detail-view">
        <div class="detail-header">
            <button class="back-btn" onclick="closeTicket()">❮</button>
            <div class="detail-header-info">
                <h2>BTS WORLD TOUR ARIRANG</h2>
                <p>30/10/2026 - MorumBis</p>
            </div>
        </div>

        <div class="ticket-carousel">
            <!-- SLIDE 1 (Print 1) -->
            <div class="ticket-slide">
                <img src="img1.jpg" alt="Ingresso 1" class="full-ticket-img">
            </div>

            <!-- SLIDE 2 (Print 2) -->
            <div class="ticket-slide">
                <img src="img2.jpg" alt="Ingresso 2" class="full-ticket-img">
            </div>

            <!-- SLIDE 3 (Print 3) -->
            <div class="ticket-slide">
                <img src="img3.jpg" alt="Ingresso 3" class="full-ticket-img">
            </div>
        </div>
        <div class="ticket-counter">← Deslize para ver os outros ingressos →</div>
    </div>

    <script>
        function openTicket() {
            document.getElementById('list-view').style.display = 'none';
            document.getElementById('detail-view').style.display = 'block';
        }
        function closeTicket() {
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('list-view').style.display = 'block';
        }
    </script>
</body>
</html>

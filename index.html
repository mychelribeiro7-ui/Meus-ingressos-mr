<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Ingressos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f1115;
            color: #ffffff;
            padding: 16px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-top: 8px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
        }
        .header-icons {
            display: flex;
            gap: 12px;
        }
        .icon-btn {
            background: #1e222b;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            cursor: pointer;
        }
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
        .tab.active {
            background-color: #ffffff;
            color: #000000;
        }
        .tab.inactive {
            background-color: #1e222b;
            color: #8b949e;
        }
        .section-title {
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .ticket-card {
            background-color: #161b22;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            gap: 16px;
            cursor: pointer;
            border: 1px solid #30363d;
            align-items: center;
            margin-bottom: 12px;
        }
        .ticket-thumb {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
        }
        .ticket-info h3 {
            font-size: 12px;
            color: #3fb950;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .ticket-info h2 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ffffff;
        }
        .ticket-info p {
            font-size: 14px;
            color: #8b949e;
        }

        /* Vista de Detalhe com Carrossel Horizontal */
        #detail-view {
            display: none;
            background-color: #0f1115;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            z-index: 100;
        }
        .detail-header {
            background-color: #161b22;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid #30363d;
        }
        .back-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }
        .detail-header-info h2 {
            font-size: 16px;
            font-weight: 600;
        }
        .detail-header-info p {
            font-size: 12px;
            color: #8b949e;
        }
